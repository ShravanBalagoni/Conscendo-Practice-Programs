<template>
    <lightning-card title="Contact Search">
        <div class="slds-m-around_medium">
            <lightning-input label="Search Contacts" value={searchKey} onchange={handleKeyChange}>

            </lightning-input>
            <template if:true={contacts.data}>
                <template for:each={contacts.data} for:item="con">
                    <p key={con.Id}>
                        <b> {con.Name}</b><br/>
                        Email:{con.Email}<br/>
                        Phone:{con.Phone}<br/>
                    </p>
                </template>
            </template>
            <template if:true={contacts.error}>
                <p class="slds-text-color_error">Error loading contacts.</p>
            </template>

            <template if:true={contacts.data} if:false={contacts.data.length}>
                <p>No contacts found.</p>
            </template>
        </div>
    </lightning-card>
</template>
