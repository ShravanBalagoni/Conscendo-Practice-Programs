<template>
    <lightning-input value={searchKey} onchange={handleKeyChange}></lightning-input>
    <lightning-button label="Search" onclick={handleSearch}></lightning-button>

    <div class="slds-m-top_medium">
        <lightning-button label="Previous" onclick={goPrevious}>
        </lightning-button>
        <span> Page pageNumber</span>
        <lightning-button 
          label="Next" 
          onclick={goNext} 
        ></lightning-button>
    </div>

    <template for:each={accounts} for:item="acc">
        <p key={acc.Id}>{acc.Name}  -  {acc.Email}</p>
    </template>
</template>
