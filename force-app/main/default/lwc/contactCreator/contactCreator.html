<template>
    <lightning-card title="Contact Creator (Publisher)" icon-name="standard:contact">
        <div class="slds-m-around_medium">
            <lightning-input 
                label="Contact Name" 
                value={contactName}
                onchange={handleNameChange}>
            </lightning-input>
            
            <lightning-button 
                label="Add Contact" 
                variant="brand" 
                onclick={addContact}
                class="slds-m-top_medium">
            </lightning-button>
            
            <div class="slds-m-top_medium slds-text-color_success">
                Total Contacts Added: <strong>{contactCount}</strong>
            </div>
        </div>
    </lightning-card>
</template>
