<template>
   <lightning-card title=" Account Decision Center" icon-name="standard:account">
    <div slot="actions">
        <lightning-button 
                label=" Record Decision" 
                variant="brand" 
                onclick={handleRecordDecision}
                class="slds-m-left_x-small">
            </lightning-button>
    </div>

    <div class="slds-p-around_large">
        <div class="slds-grid slds-gutters">
           <div class="slds-col slds-size_1-of-2">
            <h2 class="slds-text-heading_medium slds-truncate">{accountName}</h2>
           </div> 
           <div class="slds-col slds-size_1-of-2 slds-text-align_right">
            <span class="slds-badge slds-theme_info">Active</span>
           </div>
        </div>
    </div>
    <c-account-decision-history record-id={recordId}></c-account-decision-history>
    <template if:true={showSuccessMessage}>
        <div class="slds-notify slds-notify_toast slds-theme_success" role="alert">
          <span class="slds-assistive-text">Success</span>
          <span class="slds-notify__content">
            <h2>{successText}</h2>
          </span>  
        </div>
    </template>
</lightning-card> 
</template>
