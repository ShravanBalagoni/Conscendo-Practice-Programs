<template>
    <lightning-card>
        <div class="card-inner">

            <!-- Header -->
            <div class="header">
                <lightning-icon icon-name="standard:employee" size="small"></lightning-icon>
                <div class="title-group">
                    <div class="title">Attendance Punch</div>
                    <div class="subtitle">Tap to record your punch</div>
                </div>
            </div>

            <!-- Current time -->
            <div class="current-time" aria-live="polite">
                <span class="label">Current Time</span>
                <span class="time-value">{currentTime}</span>
            </div>

            <!-- Big mobile button -->
            <div class="button-wrap">
                <lightning-button
                    class="punch-button"
                    variant="brand"
                    label={buttonLabel}
                    title={buttonLabel}
                    onclick={handleClockAction}
                    disabled={isDisabled}>
                </lightning-button>
            </div>

            <!-- Quick summary chips -->
            <div class="chips">
                <div class="chip-label">First Clock In</div>
                <div class="chip-value">{clockInTime}</div>

                <div class="chip-label">Last Clock Out</div>
                <div class="chip-value">{clockOutTime}</div>

                <div class="chip-label">Total (First → Last)</div>
                <div class="chip-value">{totalHours}</div>
            </div>

            <!-- Work status line -->
            <div class="status-line">
                <span class="status-label">Work Status:</span>
                <span class="status-value">{workStatus}</span>
            </div>

            <div class="chip-label">Last Action</div>
           <div class="chip-value">{lastAction}</div>


        </div>
    </lightning-card>
</template>
