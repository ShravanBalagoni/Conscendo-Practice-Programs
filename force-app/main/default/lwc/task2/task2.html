<template>
    <lightning-card variant="Narrow" icon-name="standard:account" title="Task2">
        <lightning-input type="text"
                         label="Account Name"
                         minlength="4"
                         maxlength="15"
                         required
                         name="AccName"
                         value={accountName}
                         onchange={collectInputs}>
        </lightning-input>

        <lightning-input type="number"
                         label="Account Number"
                         name="AccNumber"
                         value={accountNumber}
                         onchange={collectInputs}>
        </lightning-input>

        <lightning-textarea name="BillingAddress"
                            label="Billing Address"
                            value={billingAddress}
                            onchange={collectInputs}>
        </lightning-textarea>

        <lightning-textarea name="Description"
                            label="Description"
                            value={description}
                            onchange={collectInputs}>
        </lightning-textarea>

        <lightning-button variant="brand"
                          label="submit"
                          title="Submit"
                          onclick={handleSubmit}>
        </lightning-button>
    </lightning-card>
</template>
