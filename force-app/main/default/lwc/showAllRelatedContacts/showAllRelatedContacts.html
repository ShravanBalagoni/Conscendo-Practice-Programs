<template>
      <lightning-card variant="narrow" icon-name="standard:contact" title="Related Contacts">
        <template if:true={relatedContacts}>
            <template for:each={relatedContacts} for:item="con">
                <p key={con.Id}>{con.LastName}--{con.Email}</p>
            </template>
        </template>
      </lightning-card>
</template>
