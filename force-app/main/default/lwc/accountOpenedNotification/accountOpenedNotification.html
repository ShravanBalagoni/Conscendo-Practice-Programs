<template>
  <div class="page-wrapper">
    <!-- Header -->
    <header class="header">
      <div class="header__logo">
        <img src="/path/to/your/logo.png" alt="Bank Logo" />
      </div>
      <div class="header__user">
        <span>{userName}</span>
        <button class="sign-out" onclick={handleSignOut}>SIGN OUT</button>
      </div>
    </header>

    <!-- Main content -->
    <main class="content">
      <div class="notification">
        <div class="notification__icon">
          <!-- Use SLDS or an inline SVG for a green checkmark -->
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="24" cy="24" r="24" fill="#E6F7EC"/>
            <path d="M16 24l6 6 12-12" stroke="#2E8555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 class="notification__title">Congratulations!</h1>
        <p class="notification__subtitle">Your Optimum Bank Account has been opened</p>

        <div class="notification__body">
          <div class="card-image">
            <img src={cardImageUrl} alt="Debit Card" />
          </div>
          <div class="account-details">
            <ul>
              <li><strong>Customer number</strong> {customerNumber}</li>
              <li><strong>Account Number</strong> {accountNumber}</li>
              <li><strong>Date account opened</strong> {dateOpened}</li>
              <li><strong>Account Funding Balance</strong> {fundingBalance}</li>
            </ul>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <nav class="footer__links">
        <a href="#">Advisors</a>
        <a href="#">Regulatory</a>
        <a href="#">Legal</a>
        <a href="#">Privacy Statements</a>
        <a href="#">Terms and Conditions</a>
      </nav>
      <p class="footer__fineprint">
        Standard Bank Isle of Man Limited ("SBIoM") is licensed by the Isle of Man Financial Services Authority, Standard Bank House, One Circular Road, Douglas, Isle of Man, IM1 1SB. Registered in the Isle of Man No. 4713C.
      </p>
    </footer>
  </div>
</template>
