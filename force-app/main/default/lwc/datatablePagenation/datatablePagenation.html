<template>
    <div class="slds-p-around_medium">
    <lightning-datatable 
                        data={paginatedAccounts}
                        columns={columnsList}
                        key-field="Id"
                        hide-checkbox-column="true"
                        >
    </lightning-datatable>
    <div class="slds-m-top_medium slds-align_absolute-center">
        <lightning-button label="Previous" onclick={handlePrevious}
            disabled={isPreviousDisabled}></lightning-button>
        <span class="slds-m-horizontal_medium">
            Page {currentPage} of {totalPages}
        </span> 
        <lightning-button label="Next" onclick={handleNext}
         disabled={isNextDisabled}></lightning-button>   
    </div>
    </div>
</template>
