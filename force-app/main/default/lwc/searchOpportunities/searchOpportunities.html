<template>
    <lightning-card variant="Narrow" title="Opportunity Search" icon-name="standard:opportunity">
        <lightning-input label="search Opportunities" 
                        placeholder="Enter the Opportunity Name"
                        value={searchKey}
                        onchange={handleChange}>
        </lightning-input>
        <template if:true={opps.data}>
            <template for:each={opps.data} for:item="opp" >
                <p key={opp.Id}>
                    <b>Name:</b>{opp.Name}<br/>
                    <b>StageName:</b>{opp.StageName}<br/>
                    <b>Account</b>{opp.AccountId}
                </p>
            </template>
        </template>
    </lightning-card>
</template>
