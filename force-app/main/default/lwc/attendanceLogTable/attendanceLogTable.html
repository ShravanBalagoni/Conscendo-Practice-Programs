<template>

    <!-- Spinner while data is loading -->
    <template if:true={isLoading}>
        <div class="full-screen-overlay">
            <lightning-spinner
                alternative-text="Loading logs"
                size="large"
                variant="brand">
            </lightning-spinner>
        </div>
    </template>

    <!-- Attendance Log Card (always render after load attempt) -->
    <template if:false={isLoading}>
        <lightning-card>

            <!-- Custom Header (Icon + Title) -->
            <div class="attendance-log-header">
                <lightning-icon
                    icon-name="standard:timeslot"
                    size="small"
                    class="attendance-log-icon">
                </lightning-icon>
                <span class="attendance-log-title">Attendance Log</span>
            </div>

            <!-- Total Hours Display -->
            <div class="summary-container">
                <p class="summary-label">Total Hours:</p>
                <p class="summary-value">{totalHours}</p>
            </div>

            <!-- Datatable -->
            <lightning-datatable
                key-field="index"
                data={pairedLogs}
                columns={columns}
                hide-checkbox-column>
            </lightning-datatable>

        </lightning-card>
    </template>

</template>
