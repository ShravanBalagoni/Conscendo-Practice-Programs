<template>

    <!-- Full-screen spinner while logs are loading -->
    <template if:false={isLoaded}>
        <div class="full-screen-overlay">
            <lightning-spinner
                alternative-text="Loading logs"
                size="large"
                variant="brand">
            </lightning-spinner>
        </div>
    </template>

    <!-- Actual attendance log card -->
    <template if:true={isLoaded}>
        <lightning-card title="Attendance Log">

            <!-- Total Hours Display -->
            <div class="summary-container">
                <p class="summary-label">Total Hours:</p>
                <p class="summary-value">{totalHours}</p>
            </div>

            <lightning-datatable
                key-field="index"
                data={pairedLogs}
                columns={columns}
                hide-checkbox-column>
            </lightning-datatable>

        </lightning-card>
    </template>

</template>
