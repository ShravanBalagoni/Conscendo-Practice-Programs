<template>
  <div class="slds-grid slds-wrap slds-p-around_medium">
    <div class="slds-col slds-size_1-of-2 ">
      <lightning-input label="First Name" name="FName" onchange={collectInputs}></lightning-input>
    </div>
    <div class="slds-col slds-size_1-of-2">
      <lightning-input label="Last Name" name="LName" onchange={collectInputs}></lightning-input>
    </div>
    <div class="slds-col slds-size_1-of-2 name=email ">
      <lightning-input label="Email" name="email" onchange={collectInputs}></lightning-input>
    </div>
    <div class="slds-col slds-size_1-of-2 name=phone">
      <lightning-input label="Phone Number" name="phone" onchange={collectInputs}></lightning-input>
    </div>
    <div class="slds-col slds-size_1-of-1 slds-m-top_medium">
      <lightning-button variant="brand" label="Submit" class="myButton" onclick={handleClick}></lightning-button>
    </div>
  </div>
</template>
