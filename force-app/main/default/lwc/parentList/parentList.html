<template>
<lightning-card title="Parent" icon-name="standard:record">
<div class="slds-p-around_medium">
<div class="slds-grid slds-align-spread slds-m-bottom_small">
<div>Selected children: <strong>{selectedCount}</strong></div>
<div>
<!-- Parent-specific action to reset only its children -->
<lightning-button label="Reset Parent's Children" onclick={handleResetParentChildren} variant="brand"></lightning-button>
</div>
</div>


<div class="children-list">
<!-- Create 3 child items with ids 1..3 -->
<c-child-item item-id="1" onchildtoggle={handleChildToggle}></c-child-item>
<c-child-item item-id="2" onchildtoggle={handleChildToggle}></c-child-item>
<c-child-item item-id="3" onchildtoggle={handleChildToggle}></c-child-item>
</div>
</div>
</lightning-card>
</template>
