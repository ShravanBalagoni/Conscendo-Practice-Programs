<template>
    <lightning-combobox 
                        name="itemSelect"
                        label="Select Item"
                        options={itemOptions}
                        value={selectedItemId}
                        onchange={handleChange}>
    </lightning-combobox>
    <lightning-button
                    label="Add to Cart"
                    onclick={handleAddClick}
                    variant="brand">
    </lightning-button>

</template>
